<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- LyCAD 应用图标 · 候选 B「十字光标 + 拾取框」
       取意绘图时最关键的那件东西——十字光标：底纹是极淡的栅格，光标一横一竖，
       交点处一个拾取框，正中一枚夹点。深色画布底色对应软件自己的暗色工作区，
       因此这版放在浅色或深色任务栏上都不怯场。
       笔画整体偏粗、图形只有三件，缩到 16 像素仍能分辨。 -->
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a333f"/>
      <stop offset="1" stop-color="#121820"/>
    </linearGradient>
  </defs>

  <rect x="40" y="40" width="432" height="432" rx="96" fill="url(#bgB)"/>

  <!-- 栅格（很淡，只在 32px 以上看得出来） -->
  <g stroke="#9dc2e8" stroke-opacity="0.15" stroke-width="4">
    <path d="M168 44 V468 M296 44 V468 M424 44 V468"/>
    <path d="M44 168 H468 M44 296 H468"/>
  </g>

  <rect x="43" y="43" width="426" height="426" rx="93" fill="none"
        stroke="#ffffff" stroke-opacity="0.16" stroke-width="6"/>

  <!-- 十字光标 -->
  <path d="M256 88 V424 M88 256 H424" fill="none" stroke="#9dc2e8"
        stroke-width="20" stroke-linecap="round"/>

  <!-- 拾取框 -->
  <rect x="198" y="198" width="116" height="116" fill="none"
        stroke="#eaf2ff" stroke-width="24"/>

  <!-- 夹点 -->
  <rect x="240" y="240" width="32" height="32" fill="#f0a952"/>
</svg>
